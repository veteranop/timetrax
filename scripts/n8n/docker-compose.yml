version: "3.8"
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: timetrax-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_METRICS=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - TIMETRAX_API_KEY=${TIMETRAX_API_KEY}
    volumes:
      - ./data:/home/node/.n8n
